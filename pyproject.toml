[project]
name = "stats-kpi-reseau"
version = "0.1.0"
description = "Application web d'analyse KPI réseau (LTE / WCDMA)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]  # STATIC_ROOT absent hors collectstatic
