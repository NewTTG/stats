services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-stats_app}
      POSTGRES_USER: ${APP_DB_USER:-stats_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?définir APP_DB_PASSWORD dans .env}
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      APP_DB_HOST: db
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  # Génération des rapports en tâche de fond (django-q2, file d'attente dans la base).
  worker:
    build: .
    env_file: .env
    environment:
      APP_DB_HOST: db
    depends_on:
      - app
    volumes:
      - media:/app/media
    command: python manage.py qcluster

volumes:
  db_data:
  media:
