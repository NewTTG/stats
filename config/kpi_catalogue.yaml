    techno: WCDMA
    unite: "%"
    categorie: retainability
    decomposition_de: wcdma_cs_drop
    numerateur: RabDropCsMissRel_p * NbrSpeechCalls / 100
    denominateur: NbrSpeechCalls
    facteur: 100
    sens: bas_est_mieux
    ecart_min: 0.1
    qualite: approx
    note: Coupures dues à une relation de voisinage 3G manquante (MissRel).

  - code: wcdma_drop_ifho
    libelle: "Coupures voix 3G : handover inter-fréquence"
    techno: WCDMA
    unite: "%"
    categorie: retainability
    decomposition_de: wcdma_cs_drop
    numerateur: RabDropCsIfho_p * NbrSpeechCalls / 100
    denominateur: NbrSpeechCalls
    facteur: 100
    sens: bas_est_mieux
    ecart_min: 0.1
    qualite: approx

  - code: wcdma_drop_irat
    libelle: "Coupures voix 3G : handover vers 2G (IRAT)"
    techno: WCDMA
    unite: "%"
    categorie: retainability
    decomposition_de: wcdma_cs_drop
    numerateur: RabDropCsIratho_p * NbrSpeechCalls / 100
    denominateur: NbrSpeechCalls
    facteur: 100
    sens: bas_est_mieux
    ecart_min: 0.1
    qualite: approx

  - code: wcdma_drop_congestion
    libelle: "Coupures voix 3G : congestion"
    techno: WCDMA
    unite: "%"
    categorie: retainability
    decomposition_de: wcdma_cs_drop
    numerateur: RabDropCsRelCong_p * NbrSpeechCalls / 100
    denominateur: NbrSpeechCalls
    facteur: 100
    sens: bas_est_mieux
    ecart_min: 0.1
    qualite: approx

  - code: wcdma_ps_drop
    libelle: Taux de coupure data (3G)
    techno: WCDMA
    unite: "%"
    categorie: retainability
    numerateur: RabDropPs_p * pmNoRabEstablishSuccessPacketInteractive / 100
    denominateur: pmNoRabEstablishSuccessPacketInteractive
    facteur: 100
    sens: bas_est_mieux
    ecart_min: 0.1
    seuils: { alerte: 2, critique: 5 }
    qualite: approx
    note: Pondéré par les RAB data établis faute de compteurs de release.

  - code: wcdma_cell_availability
    libelle: Disponibilité cellule 3G
    techno: WCDMA
    unite: "%"
    categorie: disponibilite
    numerateur: Avaibility_p
    denominateur: "1"
    sens: haut_est_mieux
    ecart_min: 0.5
    seuils: { alerte: 99, critique: 95 }

# ------------------------------------------------------- LTE : KPI détaillés
# Repris de l'outil Excel « LTE_SQL_Access » (onglets Base et KPI) : toutes les colonnes 4G de
# ses graphiques, sous un nom lisible. KPI « détaillés » : sélectionnables (sur mesure, puces,
# rapports 4G détaillés) et tracés dans les graphiques thématiques (config/graphes.yaml), mais
# pas analysés par défaut dans les événements (voir ``principal`` dans apps/kpi/catalogue.py).
#
# Pondération des taux publiés (vérifiée sur les extraits, docs/donnees_de_base.md §6) :
#   - par le compteur de tentatives quand il existe (reconstruit) ;
#   - parts de modulation, MIMO, pertes de paquets, BLER, latence : par le volume (approx) ;
#   - niveaux radio (CQI, SINR, interférences) et charges : moyenne des cellules (approx).
kpis_detailles:
  # ----- Disponibilité
  - code: lte_verrou_manuel
    libelle: "Verrouillages de cellule : manuels"
    techno: LTE
    unite: nombre
    categorie: disponibilite
    numerateur: pmCellDownLockMan
    sens: bas_est_mieux
    note: Compteur Ericsson pmCellDownLockMan tel que publié (cellule arrêtée par une intervention).

  - code: lte_verrou_auto
    libelle: "Verrouillages de cellule : automatiques"
    techno: LTE
    unite: nombre
    categorie: disponibilite
    numerateur: pmCellDownLockAuto
    sens: bas_est_mieux
    note: Compteur Ericsson pmCellDownLockAuto tel que publié (arrêt sur défaut ou alarme).

  # ----- Trafic : connexions RRC réussies par motif (les cinq parts somment à 100 %)
  - code: lte_rrc_part_urgence
    libelle: "Connexions RRC : appels d'urgence"
    techno: LTE
    unite: "%"
    categorie: trafic
    numerateur: RrcPropSucc_EM_p * pmRrcConnEstabSucc / 100
    denominateur: pmRrcConnEstabSucc
    facteur: 100
    sens: haut_est_mieux
    qualite: reconstruit

  - code: lte_rrc_part_prioritaire
    libelle: "Connexions RRC : accès prioritaire"
    techno: LTE
    unite: "%"
    categorie: trafic
    numerateur: RrcPropSucc_HPA_p * pmRrcConnEstabSucc / 100
    denominateur: pmRrcConnEstabSucc
    facteur: 100
    sens: haut_est_mieux
    qualite: reconstruit

  - code: lte_rrc_part_signalisation
    libelle: "Connexions RRC : signalisation du mobile"
    techno: LTE
    unite: "%"
    categorie: trafic
    numerateur: RrcPropSucc_MOS_p * pmRrcConnEstabSucc / 100
    denominateur: pmRrcConnEstabSucc
    facteur: 100
    sens: haut_est_mieux
    qualite: reconstruit

  - code: lte_rrc_part_data
    libelle: "Connexions RRC : données du mobile"
    techno: LTE
    unite: "%"
    categorie: trafic
    numerateur: RrcPropSucc_MOD_p * pmRrcConnEstabSucc / 100
    denominateur: pmRrcConnEstabSucc
    facteur: 100
    sens: haut_est_mieux
    qualite: reconstruit

  - code: lte_rrc_part_entrant
