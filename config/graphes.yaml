# Graphiques thématiques : plusieurs KPI d'une techno sur un même graphique, comme dans les
# outils Excel « LTE_SQL_Access » et « WCDMA_SQL_Access » (onglet Base). Un graphique par
# entité (cellule, site, commune ou réseau).
#
# series : KPI tracés, dans l'ordre de la légende.
#   type  barres          histogramme (« Histo » dans l'Excel)
#         barres_empilees histogramme cumulé (« Histo_cumul » : parts, causes, motifs)
#         ligne           courbe
#         aire            courbe remplie (« Surface »)
#   axe   gauche (axe principal, défaut) ou droite (axe secondaire)
# Le titre de chaque axe est l'unité de ses KPI.
#
# Un graphique s'affiche quand tous ses KPI sont dans le résultat ; les rapports détaillés
# (config/recherche.yaml, clé graphes) demandent tous les KPI d'un thème.

themes:
  trafic: Trafic et charge
  accessibilite: Accessibilité
  integrite: Débit et qualité radio
  retainability: Coupures
  mobilite: Mobilité

