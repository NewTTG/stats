# Vocabulaire de la recherche en langage libre (interprétation par règles locales).
#
# Les mots et expressions sont comparés sans majuscules, sans accents ni apostrophes
# (« coupure d'appel » = « coupure d appel ») ; les mots vides (le, la, de, du, à...)
# sont ignorés à l'intérieur d'une expression. L'expression la plus longue gagne :
# « coupure d'appel » (drop voix) l'emporte sur « coupure » (drop).
#
# Les KPI « causes » ne sont pas listés ici : quand la demande parle de causes
# (modificateur « causes »), on ajoute les KPI du catalogue dont `decomposition_de`
# est l'un des KPI retenus. Un code absent du catalogue est ignoré.

technos:
  LTE: [4g, lte, eutran, e utran]
  WCDMA: [3g, umts, wcdma, hspa, hsdpa, utran]

# intention -> libellé, mots, KPI par techno.
# technos_defaut : technos retenues quand la demande n'en précise pas (défaut : les deux).
# famille : proposée dans la question « Que voulez-vous voir ? » (ordre du fichier).
# absorbe : qualificatif (voir « qualificatifs ») -> intention précise. Quand la demande
#   contient cette intention, un mot qualificatif (« voix », « data »…) la précise au lieu
#   d'ouvrir l'intention Appels / Trafic : « taux de coupure voix » = drop voix seul.
intentions:
  drop:
    libelle: Drop
    absorbe: {voix: drop_voix, data: drop_data}
    famille: true
    mots: [drop, drops, dropped, dropes, coupure, coupures, chute, chutes, coupe, coupes, coupee, coupees,
           retainability, retenabilite, decroche, decroches, decrochage, perte de connexion, pertes de connexion,
           call drop, taux de coupure]
    kpis:
      LTE: [lte_erab_drop]
      WCDMA: [wcdma_cs_drop, wcdma_ps_drop]

  drop_voix:
    libelle: Drop voix
    absorbe: {voix: drop_voix, data: drop_data}
    mots: [appels coupes, appel coupe, appels interrompus, coupure d appel, coupures d appel, coupures d appels,
           coupure des appels, coupures des appels, drop voix, drop des appels, drop appel, drop appels, drop cs,
           coupure voix, coupures voix, chute d appel, chutes d appel]
    technos_defaut: [WCDMA]
    kpis:
      WCDMA: [wcdma_cs_drop]

  drop_data:
    libelle: Drop data
    absorbe: {data: drop_data, voix: drop_voix}
    mots: [drop data, drop ps, coupure data, coupures data, coupure internet, coupures internet, drop internet,
           coupures de session, drop des donnees, coupures donnees, coupure donnees]
    kpis:
      LTE: [lte_erab_drop]
      WCDMA: [wcdma_ps_drop]

  acces:
    libelle: Taux d'accès
    absorbe: {voix: acces_voix, data: acces_data}
    famille: true
    mots: [acces, accessibilite, taux d acces, etablissement, taux d etablissement, cssr, pssr, setup, connexion,
           connexions, echec, echecs, echec de connexion, echecs de connexion, accrochage, attachement]
    kpis:
      LTE: [lte_acces]
      WCDMA: [wcdma_cssr_cs, wcdma_cssr_ps]

  acces_voix:
    libelle: Accès voix
    absorbe: {voix: acces_voix, data: acces_data}
    mots: [echec d appel, echecs d appel, echecs d appels, appels echoues, appel echoue, acces voix, cssr voix,
           cssr cs, etablissement d appel, etablissement des appels, appels qui ne passent pas, appel qui ne passe pas]
    technos_defaut: [WCDMA]
    kpis:
      WCDMA: [wcdma_cssr_cs]

  acces_data:
    libelle: Accès data
    absorbe: {data: acces_data, voix: acces_voix}
    mots: [acces data, acces internet, cssr data, cssr ps, connexion data, connexion internet]
    kpis:
      LTE: [lte_acces]
      WCDMA: [wcdma_cssr_ps]

  rrc:
    libelle: Succès RRC
    absorbe: {voix: rrc, data: rrc}
    mots: [rrc, taux rrc, setup rrc, connexion rrc]
    kpis:
      LTE: [lte_rrc_setup_sr]
      WCDMA: [wcdma_rrc_cs_sr, wcdma_rrc_ps_sr]

  debit:
    libelle: Débit
    absorbe: {data: debit}
    famille: true
    mots: [debit, debits, vitesse, vitesses, throughput, thp, bande passante, mbps, rapidite, lent, lente,
           lenteur, lenteurs, debit descendant, debit dl, dl]
    kpis:
      LTE: [lte_dl_user_thp]
      WCDMA: [wcdma_hs_user_thp]

  debit_ul:
    libelle: Débit montant
    absorbe: {data: debit_ul}
    mots: [debit ul, debit montant, upload, ul, envoi, debit uplink, uplink]
    technos_defaut: [LTE]
    kpis:
      LTE: [lte_ul_user_thp]

  trafic:
    libelle: Trafic data
    famille: true
    mots: [trafic, trafic data, volume, volumes, data, donnees, consommation, payload, internet, go, giga, gigas,
           octets, telechargement, telechargements, usage]
    kpis:
      LTE: [lte_payload_dl]
      WCDMA: [wcdma_payload_hs]

  appels:
    libelle: Appels
    famille: true
    mots: [appel, appels, voix, communication, communications, telephonie, coups de fil, coup de fil, csfb]
    technos_defaut: [WCDMA, LTE]
    kpis:
      WCDMA: [wcdma_appels_voix, wcdma_speech_traffic, wcdma_duree_appel]
      LTE: [lte_csfb_appels]

  tentatives_voix:
    libelle: Tentatives d'appel
    absorbe: {voix: tentatives_voix}
    mots: [tentatives, tentative, tentatives d appel, tentatives d appels]
    technos_defaut: [WCDMA]
    kpis:
      WCDMA: [wcdma_tentatives_voix]

  erlang:
    libelle: Trafic voix (Erlang)
    absorbe: {voix: erlang}
    mots: [erlang, erlangs, trafic voix, volume voix, erl]
    technos_defaut: [WCDMA]
    kpis:
      WCDMA: [wcdma_speech_traffic]

  duree_appel:
    libelle: Durée d'appel
    absorbe: {voix: duree_appel}
    mots: [duree, duree d appel, duree des appels, duree moyenne, duree moyenne d appel, duree moyenne des appels,
           durees, duree de communication, duree des communications]
    technos_defaut: [WCDMA]
    kpis:
      WCDMA: [wcdma_duree_appel]

  sms:
    libelle: SMS
    famille: true
    mots: [sms, texto, textos, message, messages, mini message, minimessage]
    technos_defaut: [WCDMA]
    kpis:
      WCDMA: [wcdma_sms]

  disponibilite:
    libelle: Disponibilité
    famille: true
    mots: [disponibilite, disponibilites, dispo, panne, pannes, indisponible, indisponibles, indisponibilite,
           hors service, down, availability, cellule hs, site hs, coupure de site, site coupe, sites coupes]
    kpis:
      LTE: [lte_cell_availability]
      WCDMA: [wcdma_cell_availability]

  congestion:
    libelle: Congestion
    famille: true
    mots: [congestion, congestions, congestionne, congestionnes, sature, saturee, saturation, saturations, prb,
           charge, chargee, encombrement, surcharge, surcharges, occupation]
    technos_defaut: [LTE]
    kpis:
      LTE: [lte_prb_dl_util]

  mobilite:
    libelle: Handover
    mots: [handover, handovers, ho, mobilite, transfert intercellulaire, transferts intercellulaires, hand over]
    technos_defaut: [LTE]
    kpis:
      LTE: [lte_ho_intra_sr]

# Mots qui qualifient une intention (« coupure voix », « accès data ») ; seuls, ils ouvrent
# l'intention Appels (voix) ou Trafic data (data).
qualificatifs:
  voix: [voix, appel, appels, cs, communication, communications, telephonie, telephonique, telephoniques]
  data: [data, donnees, internet, ps, session, sessions, donnee]

# Mots qui modifient la demande (sans KPI propre).
modificateurs:
  causes: [cause, causes, pourquoi, raison, raisons, origine, origines, motif, motifs, ventilation, repartition,
           decomposition, detail des causes, explication, explications]
  classement: [pire, pires, classement, top, plus degrade, plus degrades, plus degradee, plus degradees,
               plus mauvais, moins bons, worst, palmares, les plus touches]
  heure_chargee: [heure chargee, heures chargees, heure de pointe, heures de pointe, busy hour, hc]
  global: [reseau, partout, global, globale, globalement, tout le reseau, ensemble du reseau, territoire,
           nouvelle caledonie, caledonie, pays, national]

# Mots courants sans effet sur la requête : reconnus, jamais signalés comme incompris.
neutres: [kpi, kpis, stat, stats, statistique, statistiques, indicateur, indicateurs, evolution, courbe, courbes,
          graphe, graphique, graphiques, tableau, valeur, valeurs, niveau, niveaux, taux, qualite, performance,
          performances, mesure, mesures, analyse, analyser, regarde, regarder, situation, bilan, etat, resume,
          synthese, moyen, moyenne, moyennes, total, totaux, nombre, combien, montre, montrer, affiche, afficher,
          donne, donner, voir, veux, voudrais, aimerais, besoin, sortir, sors, calcule, calculer, liste, lister,
          probleme, problemes, souci, soucis, incident, incidents, pendant, lors, depuis, mobile, mobiles,
          utilisateur, utilisateurs, client, clients, cellule, cellules, site, sites, commune, communes, secteur,
          secteurs, zone, zones, ville, region, province, quelle, quel, quels, quelles, comment, ya, eu, avoir,
          ete, fait, faire, merci, stp, svp, please, show, me, the, of, at, in, for, rate, radio, mobile, reseaux,
          compare, comparer, detail, details, detaille, operateur, opt, journee, journees, jour, jours, periode,
          nb, nbre, quantite, erab, volte, rab, oss, enodeb, nodeb, rnc]

# Régions et provinces (champ « région » du référentiel) -> communes correspondantes.
regions:
  - libelle: Province Nord
    mots: [province nord, nord, region nord, brousse nord]
    regions: [NORD]
  - libelle: Province Sud
    mots: [province sud]
    regions: [SUD, GRD NEA 1, NEA]
  - libelle: Sud (hors Grand Nouméa)
    mots: [sud, region sud, brousse sud]
    regions: [SUD]
  - libelle: Îles Loyauté
    mots: [iles, iles loyaute, iles loyautes, loyaute, loyautes, province des iles, province iles]
    regions: [ILES]
  - libelle: Grand Nouméa
    mots: [grand noumea, agglomeration, agglo]
    regions: [NEA, GRD NEA 1]

