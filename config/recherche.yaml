    libelle: Utilisateurs connectés
    famille: true
    rapport:
      titre: Utilisateurs 4G
      description: Estimation du nombre d'utilisateurs connectés (pic RRC)
      icone: utilisateurs
    mots: [nombre d utilisateurs, nombre utilisateurs, nb utilisateurs, nbre utilisateurs, nombre de users,
           nombre d users, users, utilisateurs connectes, utilisateur connecte, utilisateurs simultanes,
           connexions simultanees, pic d utilisateurs, pic utilisateurs, pic de connexions, combien d utilisateurs,
           nombre de clients, clients connectes, abonnes connectes, nombre d abonnes, ue connectes, nombre d ue,
           rrc connectes, rrc conn max, rrc connmax, rrcconnmax, connmax, rrc max, utilisateurs rrc,
           frequentation, affluence]
    mots_generiques: [utilisateurs, clients, abonnes]
    technos_defaut: [LTE]
    kpis:
      LTE: [lte_rrc_conn_max]

  # Rapports 4G détaillés : graphiques thématiques de l'outil Excel (config/graphes.yaml).
  rapport_lte_trafic:
    libelle: Trafic et charge 4G détaillés
    rapport:
      titre: "4G détaillée : trafic et charge"
      description: Volumes, débits cellule, utilisateurs, PRB, signalisation, CSFB, disponibilité
      icone: trafic
    mots: [trafic detaille, trafic detailles, trafic 4g detaille, charge detaillee, rapport trafic detaille,
           bilan trafic detaille, kpi trafic detailles]
    technos_defaut: [LTE]
    graphes: trafic

  rapport_lte_accessibilite:
    libelle: Accessibilité 4G détaillée
    rapport:
      titre: "4G détaillée : accessibilité"
      description: Paging, RACH, RRC (et causes d'échec), S1, E-RAB initial, ajout et modification
      icone: qualite
    mots: [accessibilite detaillee, acces detaille, acces detailles, rapport accessibilite, rapport d accessibilite,
           accessibilite complete, kpi accessibilite detailles]
    technos_defaut: [LTE]
    graphes: accessibilite

  rapport_lte_integrite:
    libelle: Débit et qualité radio 4G détaillés
    rapport:
      titre: "4G détaillée : débit et qualité radio"
      description: Débits, latence, modulation, MIMO, CQI, SINR, interférences, BLER, agrégation de porteuses
      icone: data
    mots: [integrite, integrity, rapport integrite, qualite radio detaillee, radio detaillee, debit detaille,
           debits detailles, kpi radio, indicateurs radio]
    technos_defaut: [LTE]
    graphes: integrite

  rapport_lte_coupures:
    libelle: Coupures 4G détaillées
    rapport:
      titre: "4G détaillée : coupures"
      description: Rétablissement RRC, coupures UE et E-RAB (eNodeB, cœur, actives) et leurs causes
      icone: qualite
    mots: [coupures detaillees, coupure detaillee, drop detaille, drops detailles, retainability detaillee,
           rapport retainability, retenabilite detaillee]
    technos_defaut: [LTE]
    graphes: retainability

  rapport_lte_mobilite:
    libelle: Mobilité 4G détaillée
    rapport:
      titre: "4G détaillée : mobilité"
      description: Handovers intra / inter-fréquence et d'équilibrage de charge, rejets, continuité de session
      icone: mobilite
    mots: [mobilite detaillee, handover detaille, handovers detailles, rapport mobilite, bilan mobilite,
           rapport handover, rapport handovers]
    technos_defaut: [LTE]
    graphes: mobilite

# Mots qui qualifient une intention (« coupure voix », « accès data ») ; seuls, ils ouvrent
# l'intention Appels (voix) ou Trafic data (data).
