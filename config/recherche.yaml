# Vocabulaire de la recherche en langage libre (interprétation par règles locales).
#
# Les mots et expressions sont comparés sans majuscules, sans accents ni apostrophes
# (« coupure d'appel » = « coupure d appel ») ; les mots vides (le, la, de, du, à...)
# sont ignorés à l'intérieur d'une expression. L'expression la plus longue gagne :
# « coupure d'appel » (drop voix) l'emporte sur « coupure » (drop).
#
# Les KPI « causes » ne sont pas listés ici : quand la demande parle de causes
# (modificateur « causes »), on ajoute les KPI du catalogue dont `decomposition_de`
# est l'un des KPI retenus. Un code absent du catalogue est ignoré.

technos:
  LTE: [4g, lte, eutran, e utran]
  WCDMA: [3g, umts, wcdma, hspa, hsdpa, hsupa, utran]

# Fautes usuelles acceptées dans le vocabulaire KPI. Elles s'appliquent aussi
# aux expressions composées (« dro voix », « taux de coupre », « debti ul »).
# Liste explicite : les sigles et les noms de lieux ne sont pas corrigés ici.
variantes_saisie:
  drop: [dro, drp, dorp, dropp]
  drops: [dros, drps, dorps]
  coupure: [coupre, couprue, coupuer, coupur, couppure]
  coupures: [coupres, couprues, coupuers, coupurs, couppures]
  acces: [aces, accces, accee]
  accessibilite: [accesibilite, accessibilit, accessibilitee]
  debit: [debi, debti, deibt, debitt]
  debits: [debis, debtis, deibts]
  trafic: [traffic, trafc, trafi, traffc]
  disponibilite: [disponibilit, disponiblite, disponbilite, disponibilitee]
  indisponibilite: [indisponibilit, indisponiblite, indisponbilite]
  congestion: [congetion, congeston, congsetion, congestoin]
  saturation: [saturaton, saturatoin]
  handover: [handovr, handvoer, handoer]
  appel: [apel, appe]
  appels: [apels, appls, appelss]
  utilisateurs: [utilisaters, utilsateurs, utilisaturs]
  connectes: [conectes, connctes]
  donnees: [donees, donnes]
  duree: [dure, durree]
  volume: [volum, volmue]
  connexion: [connextion, connecion, conneixon]
  connexions: [connextions, connecions, conneixons]

# Termes qui désignent une techno sans la nommer : appliqués seulement si la demande ne
# cite aucune techno (« drop E-RAB » = 4G, « CSSR » = 3G ; « 3G » ou « 4G » explicite prime).
technos_implicites:
  LTE: [e rab, erab, prb, prbs, s1, csfb, cqi, enb, enodeb, mme, volte, sinr, bler, mimo, qam, rach, paging]
  WCDMA: [hsdpa, hsupa, hspa, cssr, rab, erlang, erlangs, erl, rnc, nodeb]

# Termes qui ajoutent leur techno même quand une autre est citée : « appels 3G et CSFB » =
# appels 3G + appels CSFB (4G). (« drop E-RAB 3G » reste en 3G : E-RAB n'est pas listé ici.)
technos_ajoutees:
  LTE: [csfb]

# Sigles et termes techniques : jamais pris pour un lieu (ni trigramme, ni nom approché),
# jamais signalés comme incompris.
termes_techniques: [hsdpa, hsupa, hspa, cssr, rrc, rab, prb, prbs, cqi, csfb, volte, e rab, erab, s1, kpi, kpis, dl,
                    ul, lte, wcdma, umts, 3g, 4g, sms, erlang, erlangs, mme, enb, enodeb, nodeb, rnc, ho, irat, iho,
                    sho, ifho, pssr, gsm, 2g, 5g, nr, ran, oss, bts, rbs, erbs, sinr, bler, mimo, edge, rsrp, rsrq,
                    rscp, ecno, ec io, gprs]

# KPI ou technologies cités mais absents des données : une note le dit, la demande continue
# (« Nouméa RSRP hier » garde Nouméa ; « drop 2G » -> note puis les technos disponibles).
# terme normalisé -> libellé affiché ; « techno: true » pour une technologie absente.
indisponibles:
  rsrp: {libelle: RSRP}
  rsrq: {libelle: RSRQ}
  rscp: {libelle: RSCP}
  ecno: {libelle: Ec/No}
  volte: {libelle: VoLTE}
  2g: {libelle: 2G, techno: true}
  gsm: {libelle: 2G (GSM), techno: true}
  edge: {libelle: 2G (EDGE), techno: true}
  gprs: {libelle: 2G (GPRS), techno: true}
  5g: {libelle: 5G, techno: true}

# intention -> libellé, mots, KPI par techno.
# technos_defaut : technos retenues quand la demande n'en précise pas (défaut : les deux).
# famille : proposée dans la question « Que voulez-vous voir ? » (ordre du fichier).
# absorbe : qualificatif (voir « qualificatifs ») -> intention précise. Quand la demande
#   contient cette intention, un mot qualificatif (« voix », « data »…) la précise au lieu
#   d'ouvrir l'intention Appels / Trafic : « taux de coupure voix » = drop voix seul.
# mots_generiques : mots qui ne valent cette intention que si la demande n'en cite aucune
#   autre : « bilan Nouméa » = bilan complet, « bilan des coupures » = drop seul ;
#   « qualité à Koné » = qualité de service, « qualité du débit » = débit.
# rapport : rapport type proposé sur l'accueil (une carte, dans l'ordre du fichier) ;
#   l'ordre des KPI de chaque techno est celui de la synthèse du résultat.
# graphes : thème de config/graphes.yaml ; ajoute aux KPI de l'intention tous ceux des
#   graphiques du thème (rapports « 4G détaillée », repris de l'outil Excel LTE_SQL_Access).
intentions:
  # ------------------------------------------------------------ rapports types
  # Les demandes habituelles en un mot (« bilan », « rapport trafic »…) ou un clic sur l'accueil.
  bilan:
    libelle: Bilan complet
    famille: true
    rapport:
      description: Appels, SMS, data 4G, débit, congestion PRB, accès, coupures, utilisateurs
      icone: bilan
    mots: [bilan complet, bilan global, bilan general, bilans complets, rapport complet, rapport global,
           rapport general, synthese complete, synthese globale, stats habituelles, statistiques habituelles,
           kpi habituels, indicateurs habituels, rapport habituel, rapports habituels, rapport standard,
           rapport type, principaux kpi, kpi principaux, indicateurs principaux, principaux indicateurs,
           faire le point, point complet, point general, vue d ensemble, tableau de bord, dashboard,
           bilan mensuel, bilan hebdo, bilan hebdomadaire, rapport mensuel, rapport hebdo, rapport hebdomadaire,
           point mensuel, point hebdo]
    mots_generiques: [bilan, bilans, synthese, resume, rapport, rapports, point, stat, stats, statistique, statistiques]
    technos_defaut: [WCDMA, LTE]
    kpis:
      WCDMA: [wcdma_appels_voix, wcdma_sms, wcdma_cssr_cs, wcdma_cssr_ps, wcdma_cs_drop, wcdma_ps_drop]
      LTE: [lte_csfb_appels, lte_payload_dl, lte_rrc_conn_max, lte_dl_user_thp, lte_prb_dl_util, lte_acces,
            lte_erab_drop]

  rapport_trafic:
    libelle: Trafic voix, SMS et data
    rapport:
      titre: Trafic
      description: Appels voix (3G et CSFB), SMS, volume data 4G
      icone: trafic
    mots: [bilan trafic, rapport trafic, point trafic, trafic complet, tout le trafic, bilan du trafic,
           trafic voix et data, trafic voix sms et data, voix sms et data, appels sms et data, appels sms data]
    technos_defaut: [WCDMA, LTE]
    kpis:
      WCDMA: [wcdma_appels_voix, wcdma_sms]
      LTE: [lte_csfb_appels, lte_payload_dl]

  rapport_data:
    libelle: Data 4G
    rapport:
      description: Volume data, débit, congestion PRB, utilisateurs connectés
      icone: data
    mots: [bilan data, rapport data, point data, performance data, performances data, perf data, data complet,
           bilan internet, rapport internet, experience data]
    technos_defaut: [LTE]
    kpis:
      LTE: [lte_payload_dl, lte_dl_user_thp, lte_prb_dl_util, lte_rrc_conn_max]

  rapport_qualite:
    libelle: Qualité de service
    rapport:
      description: Taux d'accès et taux de coupure (drop), 3G et 4G
      icone: qualite
    mots: [qualite de service, qos, bilan qualite, rapport qualite, point qualite, qualite reseau,
           qualite du reseau, qualite radio, acces et coupures, acces et drop, accessibilite et coupures,
           accessibilite et retenabilite, taux d acces et de coupure, taux d acces et drop, kpi qualite,
           indicateurs qualite, kpi de qualite, indicateurs de qualite]
    mots_generiques: [qualite]
    technos_defaut: [LTE, WCDMA]
    kpis:
      LTE: [lte_acces, lte_erab_drop]
      WCDMA: [wcdma_cssr_cs, wcdma_cssr_ps, wcdma_cs_drop, wcdma_ps_drop]

  # ------------------------------------------------------------ indicateurs
  drop:
    libelle: Drop
    absorbe: {voix: drop_voix, data: drop_data}
    famille: true
    mots: [drop, drops, dropped, dropes, coupure, coupures, chute, chutes, coupe, coupes, coupee, coupees,
