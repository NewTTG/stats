{% extends "base.html" %}
{% block titre %}Connexion — Stats KPI réseau{% endblock %}
{% block contenu %}
<div class="carte" style="max-width: 380px; margin: 3rem auto;">
  <h2>Connexion</h2>
  {% if form.errors %}<p class="erreur">Identifiant ou mot de passe incorrect.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label for="id_username">Utilisateur</label>{{ form.username }}</p>
    <p><label for="id_password">Mot de passe</label>{{ form.password }}</p>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="bouton" type="submit">Se connecter</button>
  </form>
</div>
{% endblock %}
