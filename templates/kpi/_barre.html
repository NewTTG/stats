<form class="recherche {{ classe }}" method="get" action="{% url 'kpi:requete' %}" role="search">
  <label class="sr-only" for="q{{ suffixe }}">Votre demande</label>
  <div class="champ-recherche">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q{{ suffixe }}" name="q" type="search" value="{{ q }}" autocomplete="off" spellcheck="false"
           placeholder="Ex. : {% if exemples %}{{ exemples.0 }}{% else %}drop 3G à Nouméa la semaine dernière{% endif %}"{% if autofocus %} autofocus{% endif %}
           aria-describedby="aide-q{{ suffixe }}">
    <button class="bouton" type="submit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="texte-bouton">Rechercher</span></button>
  </div>
  <div class="sous-barre">
    {% if ia_disponible %}
    <label class="case-ia"><input type="checkbox" name="ia" value="1"{% if ia %} checked{% endif %}> ✨ Recherche IA</label>
    {% endif %}
    <span class="aide" id="aide-q{{ suffixe }}">KPI, lieu (commune, site, trigramme, événement) et période, en langage courant.</span>
  </div>
</form>
